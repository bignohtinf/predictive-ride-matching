model:
  primary: lightgbm
  baseline: logistic_regression

  lightgbm:
    objective: binary
    metric: [binary_logloss, auc]
    boosting_type: gbdt
    num_leaves: 63
    learning_rate: 0.05
    max_depth: 10
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 9.0  # ratio of positive/negative
    n_estimators: 1000
    early_stopping_rounds: 50
    verbose: -1

  xgboost:
    objective: binary:logistic
    eval_metric: [logloss, auc]
    max_depth: 8
    learning_rate: 0.05
    n_estimators: 1000
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 9.0
    early_stopping_rounds: 50

  calibration:
    method: isotonic  # platt | isotonic
    cv_folds: 5

training:
  test_size: 0.15
  val_size: 0.15
  split_strategy: temporal  # temporal | stratified
  random_seed: 42

  tuning:
    enabled: true
    engine: optuna
    n_trials: 100
    timeout_seconds: 3600

evaluation:
  metrics:
    - auc_roc
    - auc_pr
    - log_loss
    - ece
    - precision_at_k
  thresholds:
    auc_roc_min: 0.80
    log_loss_max: 0.25
    ece_max: 0.05
