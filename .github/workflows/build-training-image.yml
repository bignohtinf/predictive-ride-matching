name: Build Training Image

on:
  push:
    branches: ["main"]
    paths:
      - "src/training/**"
      - "infrastructure/docker/Dockerfile.training"
      - ".github/workflows/build-training-image.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY_URL: ${{ vars.TRAINING_ECR_REPOSITORY_URL }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          IMAGE_TAG=${GITHUB_SHA::12}
          docker build -f infrastructure/docker/Dockerfile.training -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" .
          docker tag "$ECR_REPOSITORY_URL:$IMAGE_TAG" "$ECR_REPOSITORY_URL:dev"

      - name: Push image
        run: |
          IMAGE_TAG=${GITHUB_SHA::12}
          docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY_URL:dev"
