apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crp-inference.fullname" . }}-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "crp-inference.labels" . | nindent 4 }}
data:
  MODEL_S3_URI: {{ .Values.model.s3Uri | quote }}
  MODEL_DIR: {{ .Values.model.mountPath | quote }}
  MODEL_FILE: {{ .Values.model.fileName | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  WORKERS: {{ .Values.app.workers | quote }}
  BATCH_MAX_SIZE: {{ .Values.app.batchMaxSize | quote }}
