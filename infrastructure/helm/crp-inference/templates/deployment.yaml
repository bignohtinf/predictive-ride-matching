apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crp-inference.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "crp-inference.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "crp-inference.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "crp-inference.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      volumes:
        - name: model-volume
          emptyDir: {}
      initContainers:
        - name: download-model
          image: public.ecr.aws/aws-cli/aws-cli:2.17.52
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              aws s3 cp "$MODEL_S3_URI" "{{ .Values.model.mountPath }}/{{ .Values.model.fileName }}"
              ls -lh "{{ .Values.model.mountPath }}"
          envFrom:
            - configMapRef:
                name: {{ include "crp-inference.fullname" . }}-config
          volumeMounts:
            - name: model-volume
              mountPath: {{ .Values.model.mountPath }}
      containers:
        - name: crp-inference
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          envFrom:
            - configMapRef:
                name: {{ include "crp-inference.fullname" . }}-config
          env:
            - name: REDIS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.authTokenKey }}
                  optional: true
          volumeMounts:
            - name: model-volume
              mountPath: {{ .Values.model.mountPath }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
